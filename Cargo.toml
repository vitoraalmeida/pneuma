[package]
name = "pneuma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
