schema_version = 2

[system]
name = "fixtures-test"

[application]
name = "bad-port"

[delivery]
type = "oci"
image = "localhost:5000/bad-port"

[source]
repository = "local"
branch = "main"

[build]
containerfile = "Containerfile"
context = "."

[runtime]
container_port = 8080
healthcheck_path = "/healthz"
expected_status = 200

[exposure]
default_visibility = "internal"
