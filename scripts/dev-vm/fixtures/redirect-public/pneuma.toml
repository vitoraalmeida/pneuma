schema_version = 2

[system]
name = "fixtures-test"

[application]
name = "redirect-public"

[delivery]
type = "oci"
image = "localhost:5000/redirect-public"

[source]
repository = "local"
branch = "main"

[build]
containerfile = "Containerfile"
context = "."

[runtime]
container_port = 8080
healthcheck_path = "/healthz"
expected_status = 200

[exposure]
default_visibility = "public"
domain = "redirect-public.pneuma.test"
